# PRESET: quick smoke test — fast sanity check.
# ~8 messages, email + SMS, fresh drafts only. Cheap and quick.
name = "quick-smoke"
description = "Fast sanity check — email + SMS, fresh drafts, a handful of messages."

[target]
base_url = "http://localhost:8000"
dev_email = "harness-operator@example.com"

[council]
models = ["council/claude"]

# Reviewers omitted → uses the default voter-POV council. Add [[reviewers]] to customize.

[matrix]
channels = ["email", "sms"]
intents = ["fresh_draft"]
repeats_per_cell = 1
max_sims = 8

[budgets]
council_usd = 5.0
backend_draft_usd = 3.0

[flagging]
cluster = true

[output]
db_path = "runs/harness.db"

[rubric]
sms_max_chars = 320
broadcast_slot_seconds = 30
words_per_sec = 2.5
speech_min_words = 120
stance_drift_warn = 0.50
stance_drift_high = 0.75

[rubric.dimensions]
scaffolding_leak            = { enabled = true, severity = "high" }
empty_or_refused            = { enabled = true, severity = "high" }
fabricated_operational_info = { enabled = true, severity = "high" }
chat_routing                = { enabled = true, severity = "high" }
length_contract             = { enabled = true }
markdown_in_plaintext       = { enabled = true, severity = "medium" }
compliance_phrasing         = { enabled = true, severity = "medium" }
stance_drift                = { enabled = true }
