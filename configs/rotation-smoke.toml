# PRESET: rotation smoke — tiny, cheap sanity check of the 5-model × 5-job rotation.
# A few drafts, each reviewed under all 5 rotations by all 5 models. Proves the loop.
name = "rotation-smoke"
description = "Tiny rotation sanity check — a few drafts, full 5×5 rotating council."

[target]
base_url = "http://localhost:8000"
dev_email = "harness-operator@example.com"

[council]
models = ["claude", "gpt", "gemini", "grok", "kimi"]

[matrix]
channels = ["email", "sms", "speech"]
intents = ["fresh_draft"]
repeats_per_cell = 1
max_drafts = 3
rotations_per_draft = 5
max_sims = 15

[budgets]
per_model_usd = 2.0
backend_draft_usd = 2.0
council_usd = 10.0

[flagging]
cluster = true

[output]
db_path = "runs/harness.db"

[rubric]
sms_max_chars = 320
broadcast_slot_seconds = 30
words_per_sec = 2.5
speech_min_words = 120
stance_drift_warn = 0.50
stance_drift_high = 0.75

[rubric.dimensions]
scaffolding_leak            = { enabled = true, severity = "high" }
empty_or_refused            = { enabled = true, severity = "high" }
fabricated_operational_info = { enabled = true, severity = "high" }
chat_routing                = { enabled = true, severity = "high" }
length_contract             = { enabled = true }
markdown_in_plaintext       = { enabled = true, severity = "medium" }
compliance_phrasing         = { enabled = true, severity = "medium" }
stance_drift                = { enabled = true }
